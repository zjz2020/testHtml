<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到我们的网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            line-height: 1.6;
            color: #333;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-links li {
            margin-left: 2rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #3498db;
        }

        .hero {
            height: 100vh;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: white;
            color: #2c3e50;
            text-decoration: none;
            border-radius: 5px;
            transition: transform 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .features {
            padding: 5rem 0;
            background: #f9f9f9;
        }

        .features-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .feature-card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .feature-card h3 {
            margin: 1rem 0;
            color: #2c3e50;
        }

        .footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem 0;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .hero h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <div class="logo">Logo</div>
            <ul class="nav-links">
                <li><a href="#home">首页</a></li>
                <li><a href="#features">功能</a></li>
                <li><a href="#about">关于</a></li>
                <li><a href="#contact">联系我们</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero" id="home">
        <div class="hero-content">
            <h1>欢迎来到我们的网站</h1>
            <p>我们提供最优质的服务和解决方案，帮助您的业务更上一层楼</p>
            <a href="#contact" class="btn">了解更多</a>
        </div>
    </section>

    <section class="features" id="features">
        <div class="features-container">
            <div class="feature-card">
                <h3>创新设计</h3>
                <p>我们提供创新的设计解决方案，让您的产品脱颖而出</p>
            </div>
            <div class="feature-card">
                <h3>专业团队</h3>
                <p>由经验丰富的专业人士组成的团队，确保项目质量</p>
            </div>
            <div class="feature-card">
                <h3>优质服务</h3>
                <p>提供全方位的优质服务，满足您的各种需求</p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2024 公司名称. 保留所有权利.</p>
    </footer>
</body>
</html>
